<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UniBite - Φοιτητικό Food Sharing</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Righteous&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    
</head>
<body>
    <div class="bg-decoration"></div>
    <div class="bg-decoration"></div>
    <div class="bg-decoration"></div>

    <div class="container">
        <header>
            <h1 class="logo">UniBite</h1>
            <p class="tagline">Μοιράσου φαγητό, κέρδισε πόντους, γλίτωσε χρόνο!</p>
        </header>

        <div class="login-card">
            <h2>Login</h2>
            <p>Καλώς ήρθες πίσω στην κοινότητα!</p>
            
            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="student@university.gr" required>
                </div>
                
                <div class="form-group">
                    <label for="password">Κωδικός</label>
                    <input type="password" id="password" name="password" placeholder="••••••••" required>
                </div>

                
                
                <button type="submit" class="btn btn-primary">Είσοδος</button>
            </form>

            <div class="divider">
                <span>ή</span>
            </div>

            <button class="btn btn-secondary" onclick="window.location.href='register.html'">
                Δημιουργία Λογαριασμού
            </button>
        </div>

        
    </div>

    <script type=module src="../js/pages/login.js"></script>
</body>
</html>
