<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Listing Creator</title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="">
    </head>
    <body>
    <div id="top-bar"></div>
    <script src="../js/components/top-bar-loader.js"></script>
  </header>
        <h1>Create Listing</h1>
        <form>
            <div class ="form-group">
                <label for="mealName">Meal Name</label>
                <input type="text" id="mealName" name="mealName" placeholder="e.g. Pasta with Tomato Sauce" required>
            </div>
            <div class="form-group">
                <label for="description">Description</label>
                <textarea id="description" name="description" placeholder="A delicious homemade meal..."></textarea>
            </div>
            <div class="form-group">
                <label for="quantity">Quantity</label>
                <input type="number" id="quantity" min="1" name="quantity" placeholder="e.g. 5" required>
            </div>
        
            <main class="form-container">

  <h1>Create Listing</h1>

  <form id="createPostForm">

    <div class="form-group">
      <label for="mealName">Meal Name</label>
      <input type="text" id="mealName" name="mealName" required>
    </div>

    <div class="form-group">
      <label for="description">Description</label>
      <textarea id="description" name="description"></textarea>
    </div>

    <div class="form-group">
      <label for="quantity">Quantity</label>
      <input type="number" id="quantity" name="quantity" min="1" required>
    </div>

    <div class="form-group">
      <label for="location">Pickup Location</label>
      <input type="text" id="location" name="location">
    </div>

    <div class="form-group">
      <label for="time">Pickup Time</label>
      <input type="time" id="time" name="time">
    </div>

    <div class="form-group">
      <label>Allergens:</label>
      <div class="checkbox-group">
        <label><input type="checkbox" name="allergens" value="gluten"> Gluten</label>
        <label><input type="checkbox" name="allergens" value="milk"> Milk</label>
        <label><input type="checkbox" name="allergens" value="nuts"> Nuts</label>
      </div>
    </div>

    <div class="form-group">
      <label for="image">Meal Image</label>
      <input type="file" id="image" name="image" accept="image/*">
    </div>

    <button type="submit">Create Listing</button>

  </form>

</main>
        
    </body>
</html>
