<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Listing Creator</title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="../css/styles.css">
    </head>
    <body>
    <div id="top-bar"></div>
    <script src="../js/components/top-bar-loader.js"></script>
    <script src="../js/pages/user-data.js"></script>
  </header>
        

  

  <form class="createPostForm">
    <h1>Create Listing</h1>
    <div class="form-group">
      <label for="mealName">Meal Name</label>
      <input class="form-control-name" type="text" id="mealName" name="mealName" required>
    </div>

    <div class="form-group">
      <label for="description">Description</label>
      <textarea class="form-control-description" id="description" name="description"></textarea>
    </div>

    <div class="form-group">
      <label for="quantity">Quantity</label>
      <input class="form-control-quantity" type="number" id="quantity" name="quantity" min="1" required>
    </div>

    <div class="form-group">
      <label for="location">Pickup Location</label>
      <input class="form-control-location" type="text" id="location" name="location">
    </div>

    <div class="form-group">
      <label for="time">Pickup Time</label>
      <input class="form-control-time" type="time" id="time" name="time">
    </div>

    <div class="form-group">
      <label>Allergens:</label>
      <div class="checkbox-group">
        <label><input type="checkbox" value="celery"> Celery</label>
  <label><input type="checkbox" value="gluten"> Gluten</label>
  <label><input type="checkbox" value="crustaceans"> Crustaceans</label>
  <label><input type="checkbox" value="eggs"> Eggs</label>
  <label><input type="checkbox" value="fish"> Fish</label>
  <label><input type="checkbox" value="lupin"> Lupin</label>
  <label><input type="checkbox" value="milk"> Milk</label>
  <label><input type="checkbox" value="molluscs"> Molluscs</label>
  <label><input type="checkbox" value="mustard"> Mustard</label>
  <label><input type="checkbox" value="nuts"> Tree Nuts</label>
  <label><input type="checkbox" value="peanuts"> Peanuts</label>
  <label><input type="checkbox" value="sesame"> Sesame Seeds</label>
  <label><input type="checkbox" value="soy"> Soy</label>
  <label><input type="checkbox" value="sulphites"> Sulphur dioxide and sulphites</label>
</div>
    </div>


    <button class="createListingBtn" type="submit">Create Listing</button>

  </form>

</main>
        
    </body>
</html>
